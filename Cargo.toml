[package]
name = "profile-curator-mcp"
version = "0.1.1"
edition = "2024"
authors = ["ahndunn@gmail.com"]
description = "Stateless MCP server for iterative profile curation and cv-writer export"
repository = "git@github.com:ahndunn/profile-curator.git"

[dependencies]
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["serde", "v4"] }

[dev-dependencies]
tokio-test = "0.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
