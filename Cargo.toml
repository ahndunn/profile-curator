[package]
name = "profile-curator"
version = "0.2.0"
edition = "2024"
authors = ["ahndunn@gmail.com"]
description = "Conversational profile curation CLI engine with interview story vault and cv-writer export"
repository = "git@github.com:ahndunn/profile-curator.git"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["serde", "v4"] }

[dev-dependencies]
tokio-test = "0.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
